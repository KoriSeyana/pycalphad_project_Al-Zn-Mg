[project]
name = "calphad-alloy-virtual-data"
version = "0.1.0"
description = "Generate virtual aluminum-alloy data with CALPHAD calculations"
readme = "README.md"
requires-python = ">=3.10,<4"
license = { text = "MIT" }
dependencies = [
    "pycalphad>=0.11.0,<0.12.0",
    "numpy>=1.24.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.10.0,<2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
